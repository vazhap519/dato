name: Number meanings editorial audit
on:
  push:
    paths:
      - 'database/seeders/**'
      - 'scripts/audit_number_meanings.php'
      - '.github/workflows/number-meanings-audit.yml'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, sqlite3
      - name: PHP syntax validation
        run: |
          find database/seeders -maxdepth 1 -name '*.php' -print0 | xargs -0 -n1 php -l
          php -l scripts/audit_number_meanings.php
      - name: Check number coverage and duplicated editorial text
        run: |
          set -o pipefail
          php scripts/audit_number_meanings.php | tee number-meanings-audit.json
      - name: Test complete import on disposable SQLite database
        run: |
          set -euo pipefail
          composer install --no-interaction --prefer-dist --no-progress
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p database
          touch database/number-meanings-ci.sqlite
          export DB_CONNECTION=sqlite
          export DB_DATABASE="$PWD/database/number-meanings-ci.sqlite"
          export SESSION_DRIVER=array
          export CACHE_STORE=array
          export QUEUE_CONNECTION=sync
          php artisan migrate --force
          php artisan db:seed --class=AllEditorialNumberMeaningsSeeder --force
          php scripts/verify_number_meanings.php | tee number-meanings-db-verification.json
          php artisan db:seed --class=AllEditorialNumberMeaningsSeeder --force
          php scripts/verify_number_meanings.php
      - name: Publish readable audit summary
        if: always()
        shell: bash
        run: |
          if [ ! -s number-meanings-audit.json ]; then
            echo '## Number meanings audit' >> "$GITHUB_STEP_SUMMARY"
            echo 'Audit report not generated. Inspect preceding job logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo '## Number meanings audit — 1–999'
            echo
            echo "| Metric | Result |"
            echo "|---|---:|"
            echo "| Distinct numbers | $(jq '.distinct_numbers' number-meanings-audit.json) / 999 |"
            echo "| Missing numbers | $(jq '.missing | length' number-meanings-audit.json) |"
            echo "| Overlapping definitions | $(jq '.overlapping_definitions | length' number-meanings-audit.json) |"
            echo "| Exact duplicate groups | $(jq '[.exact_duplicate_text[][]] | length' number-meanings-audit.json) |"
            echo "| Near-duplicate candidates | $(jq '[.near_duplicate_candidates[][]] | length' number-meanings-audit.json) |"
            echo "| Parsing / empty-field errors | $(jq '.errors | length' number-meanings-audit.json) |"
            echo
            echo '### Missing numbers'
            echo '```json'
            jq -c '.missing' number-meanings-audit.json
            echo '```'
            echo '### Exact duplicate groups'
            echo '```json'
            jq -c '.exact_duplicate_text' number-meanings-audit.json
            echo '```'
            echo '### Near-duplicate candidates (first 100 per field)'
            echo '```json'
            jq -c '.near_duplicate_candidates | with_entries(.value |= .[:100])' number-meanings-audit.json
            echo '```'
            echo 'Full JSON is available in the workflow artifact.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Save report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: number-meanings-audit
          path: |
            number-meanings-audit.json
            number-meanings-db-verification.json
          if-no-files-found: ignore

      - name: Sync audit result to a single GitHub issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          title="[AUTO] Number meanings 1-999 audit status"
          report="/tmp/number-meanings-issue.md"
          {
            echo "Automatically updated by the editorial audit workflow."
            echo
            echo "Commit: \`${GITHUB_SHA}\`"
            echo "Run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
            echo
            if [ -s number-meanings-audit.json ]; then
              echo "| Metric | Count |"
              echo "|---|---:|"
              echo "| Distinct numbers | $(jq '.distinct_numbers' number-meanings-audit.json) |"
              echo "| Missing | $(jq '.missing | length' number-meanings-audit.json) |"
              echo "| Overlapping definitions | $(jq '.overlapping_definitions | length' number-meanings-audit.json) |"
              echo "| Exact duplicate groups | $(jq '[.exact_duplicate_text[][]] | length' number-meanings-audit.json) |"
              echo "| Near duplicate candidates | $(jq '[.near_duplicate_candidates[][]] | length' number-meanings-audit.json) |"
              echo "| Errors | $(jq '.errors | length' number-meanings-audit.json) |"
              echo
              echo "### Exact duplicates"
              echo '```json'
              jq -c '.exact_duplicate_text' number-meanings-audit.json
              echo '```'
              echo "### Near duplicates"
              echo '```json'
              jq -c '.near_duplicate_candidates | with_entries(.value |= .[:100])' number-meanings-audit.json
              echo '```'
              echo "### Errors and missing"
              echo '```json'
              jq -c '{errors,missing,overlapping_definitions}' number-meanings-audit.json
              echo '```'
            else
              echo "Audit JSON was not generated; inspect workflow logs."
            fi
          } > "$report"
          issue_number=$(gh issue list --state all --limit 100 --json number,title --jq ".[] | select(.title == \"${title}\") | .number" | head -n 1)
          if [ -n "$issue_number" ]; then
            gh issue edit "$issue_number" --body-file "$report"
          else
            gh issue create --title "$title" --body-file "$report"
          fi
